name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже стоит на сервере GitHub, скачивать не нужно.
      # Этот шаг просто на всякий случай и никогда не роняет сборку:
      - name: SDK 34 (if missing)
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Install deps
        run: npm install

      - name: Collect web files into www
        run: |
          mkdir -p www
          cp -r index.html css js data novels assets www/

      - name: Add Android platform
        run: npx cap add android

      - name: Fullscreen + hide status bar natively
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n    </style>#g' "$STYLES"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hanami-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
